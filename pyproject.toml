[project]
name = "gapq-bench"
version = "0.1.0"
description = "Reference benchmark harness for GapQ-PL (Question Generation for Gaps in Polish Tax Interpretations)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "datasets>=2.19",
    "sentence-transformers>=2.7",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.0,<3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]
google = ["langchain-google-genai>=2.0"]
all = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
]

[project.urls]
Dataset = "https://huggingface.co/datasets/AI-TAX/gapq-pl-dataset"

[project.scripts]
gapq-bench = "gapq_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gapq_bench"]
